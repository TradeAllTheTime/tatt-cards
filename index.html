/* ---------------- TIMER ---------------- */

function getNextConcert() {
  const now = new Date();
  return concerts
    .filter(c => c.time > now)
    .sort((a, b) => a.time - b.time)[0];
}

function updateTimer() {
  const next = getNextConcert();

  if (!next) return;

  const diff = next.time - new Date();

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${next.name}: ${d}d ${h}h ${m}m ${s}s`;
}

setInterval(updateTimer, 1000);
updateTimer();

/* ---------------- PACK SYSTEM ---------------- */

const cardPool = {
  common: ["Common Sketch", "Tour Draft", "Stage Study"],
  uncommon: ["Lighting Scene", "Green Room"],
  rare: ["Golden Moment"],
  ultraRare: ["Legendary Shot"]
};

function getRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function getPackData() {
  return JSON.parse(localStorage.getItem("packData")) || {
    date: null,
    count: 0
  };
}

function savePackData(data) {
  localStorage.setItem("packData", JSON.stringify(data));
}

function canOpenPack() {
  const data = getPackData();
  const today = new Date().toDateString();

  if (data.date !== today) {
    data.date = today;
    data.count = 0;
    savePackData(data);
  }

  return data.count < 3 || window.DEV_MODE;
}

function markPackUsed() {
  const data = getPackData();
  const today = new Date().toDateString();

  if (data.date !== today) {
    data.date = today;
    data.count = 0;
  }

  data.count++;
  savePackData(data);
}

let seenCards = new Set();

/* ---------------- OPEN PACK ---------------- */

function openPack() {

  if (!canOpenPack()) {
    alert("No packs left today!");
    return;
  }

  markPackUsed();

  let pack = [];

  for (let i = 0; i < 6; i++) {
    pack.push({ name: getRandom(cardPool.common), rarity: "common" });
  }

  for (let i = 0; i < 3; i++) {
    pack.push({ name: getRandom(cardPool.uncommon), rarity: "uncommon" });
  }

  const roll = Math.random();

  if (roll < 0.75) {
    pack.push({ name: getRandom(cardPool.rare), rarity: "rare" });
  } else {
    pack.push({ name: getRandom(cardPool.ultraRare), rarity: "ultra rare" });
  }

  pack.sort(() => Math.random() - 0.5);

  const container = document.getElementById("packReveal");
  container.innerHTML = "<h3>Opening Pack...</h3>";

  setTimeout(() => {
    container.innerHTML = "";

    let i = 0;

    function showNextCard() {
      if (i >= pack.length) return;

      const card = document.createElement("div");

      const rarity = pack[i].rarity;

      card.style.padding = "10px";
      card.style.margin = "8px 0";
      card.style.borderRadius = "10px";
      card.style.background = "#222";
      card.style.opacity = "0";
      card.style.transform = "rotateY(90deg)";
      card.style.transition = "all 0.4s ease";

      card.textContent = `${pack[i].name} (${rarity})`;

      if (rarity === "common") card.style.boxShadow = "0 0 10px yellow";
      if (rarity === "uncommon") card.style.boxShadow = "0 0 10px dodgerblue";
      if (rarity === "rare") card.style.boxShadow = "0 0 12px purple";
     if (rarity === "ultra rare") {
  card.style.boxShadow = "0 0 15px red";

  card.style.animation = "rainbowBorder 2s linear infinite";
}
      const key = pack[i].name;

      if (!seenCards.has(key)) {
        const badge = document.createElement("div");
        badge.textContent = "NEW!";
        badge.style.fontSize = "10px";
        badge.style.background = "yellow";
        badge.style.color = "black";
        badge.style.display = "inline-block";
        badge.style.padding = "2px 6px";
        badge.style.borderRadius = "6px";

        card.appendChild(badge);
        seenCards.add(key);
      }

      container.appendChild(card);

      setTimeout(() => {
        card.style.opacity = "1";
        card.style.transform = "rotateY(0deg)";
      }, 50);

      i++;
      setTimeout(showNextCard, 250);
    }

    showNextCard();

  }, 600);
}
