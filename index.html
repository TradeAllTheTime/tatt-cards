<script>
document.getElementById("timer").textContent = "Testing CSV...";

fetch("./shows.csv")
  .then(res => res.text())
  .then(text => {
    document.getElementById("timer").textContent =
      "CSV LOADED: " + text.split("\n")[1];
  })
  .catch(err => {
    document.getElementById("timer").textContent =
      "CSV FAILED";
    console.log(err);
  });
</script>
