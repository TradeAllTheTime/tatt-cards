<!DOCTYPE html>
<html>
<head>
  <title>TATT Cards</title>

  <style>
#packReveal {
  position: relative;
  height: 340px;
  margin-top: 20px;
}

/* STACK */
.deck-card {
  width: 220px;
  height: 140px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform-style: preserve-3d;
  transition: transform 0.35s ease;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.deck-card.flipped .card-inner {
  transform: rotateY(180deg);
}

/* FACES */
.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: Arial;
}

.card-back {
  background:#333;
  color:white;
}

.card-front {
  background:#222;
  transform: rotateY(180deg);
  color:white;
}

/* DISCARD */
#discardPile {
  position: absolute;
  right: 10px;
  top: 10px;
  width: 220px;
  display:flex;
  flex-direction: column;
  gap: 8px;
}

.discardCard {
  width: 220px;
  height: 140px;
  background:#222;
  color:white;
  border-radius: 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: Arial;
}

/* RARITY GLOWS (ONLY AFTER FLIP) */
.commonGlow { box-shadow: 0 0 10px yellow; }
.uncommonGlow { box-shadow: 0 0 10px dodgerblue; }
.rareGlow { box-shadow: 0 0 12px purple; }

.ultraGlow {
  box-shadow: 0 0 18px white;
  border: 2px solid transparent;
  background-image:
    linear-gradient(#222, #222),
    linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
  background-origin: border-box;
  background-clip: padding-box, border-box;
  animation: rainbow 1.5s linear infinite;
}

@keyframes rainbow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}


/* GRID END VIEW */
#gridView {
  display:none;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.grid-card {
  background:#222;
  color:white;
  padding: 10px;
  border-radius: 10px;
  font-family: Arial;
  text-align:center;
}
    button {
  padding: 10px 16px;
  border-radius: 10px;
  border: none;
  background: #222;
  color: white;
  cursor: pointer;
  margin: 5px;
}

/* ensures pack never overlaps UI */
#packReveal {
  margin-top: 20px;
  position: relative;
  min-height: 300px;
  overflow: visible;
}
  </style>
</head>

function updateTimer() {
  const next = concerts.filter(c => c.time > new Date())[0];
  if (!next) return;

  const diff = next.time - new Date();

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${next.name}: ${d}d ${h}h ${m}m ${s}s`;
}

setInterval(updateTimer, 1000);
updateTimer();

/* ---------------- PACK SYSTEM ---------------- */

const cardPool = {
  common: ["Common Sketch", "Tour Draft", "Stage Study"],
  uncommon: ["Lighting Scene", "Green Room"],
  rare: ["Golden Moment"],
  ultraRare: ["Legendary Shot"]
};

function getRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

let deck = [];
let flippedIndex = null;
let openedCards = [];

/* ---------------- OPEN PACK ---------------- */

function openPack() {
  deck = [];
  openedCards = [];
  flippedIndex = null;

  for (let i = 0; i < 10; i++) {
    let rarity =
      i < 6 ? "common" :
      i < 9 ? "uncommon" :
      Math.random() < 0.75 ? "rare" : "ultra";

    let pool =
      rarity === "common" ? cardPool.common :
      rarity === "uncommon" ? cardPool.uncommon :
      rarity === "rare" ? cardPool.rare :
      cardPool.ultraRare;

    deck.push({ name: getRandom(pool), rarity });
  }

  renderDeck();
}

/* ---------------- RENDER ---------------- */

function renderDeck() {
  const container = document.getElementById("packReveal");
  container.innerHTML = "";

  const discard = document.createElement("div");
  discard.id = "discardPile";
  container.appendChild(discard);

  deck.forEach((card, i) => {
    const el = document.createElement("div");
    el.className = "deck-card";

    const inner = document.createElement("div");
    inner.className = "card-inner";

    const back = document.createElement("div");
    back.className = "card-face card-back";
    back.textContent = "TATT CARD";

    const front = document.createElement("div");
    front.className = "card-face card-front";
    front.textContent = card.name;

    inner.appendChild(back);
    inner.appendChild(front);
    el.appendChild(inner);

    el.dataset.index = i; // 🔥 IMPORTANT FIX

    const offset = i * 5;

    el.style.zIndex = deck.length - i;
    el.style.transform =
      `translate(-50%, -50%) translateY(${offset}px) scale(${1 - i * 0.02})`;

    el.style.position = "absolute";
    el.style.left = "50%";
    el.style.top = "50%";

    el.onclick = () => handleCard(i);

    container.appendChild(el);
  });
}

/* ---------------- CLICK LOGIC ---------------- */

function handleCard(index) {
  const cardEl = document.querySelectorAll(".deck-card")[index];
  const data = deck[index];

  if (!cardEl.classList.contains("flipped")) {
    cardEl.classList.add("flipped");

    const front = cardEl.querySelector(".card-front");

    setTimeout(() => {
      front.textContent = `${data.name} (${data.rarity})`;

      if (data.rarity === "common") cardEl.classList.add("commonGlow");
      if (data.rarity === "uncommon") cardEl.classList.add("uncommonGlow");
      if (data.rarity === "rare") cardEl.classList.add("rareGlow");
      if (data.rarity === "ultra") cardEl.classList.add("ultraGlow");
    }, 250);

    return;
  }

  const discard = document.getElementById("discardPile");

  const final = document.createElement("div");
  final.className = "discardCard";
  final.textContent = `${data.name} (${data.rarity})`;

  discard.appendChild(final);

  deck.splice(index, 1);

  if (deck.length === 0) {
    showGrid();
  } else {
    renderDeck();
  }
}
/* ---------------- GRID ---------------- */

function showGrid() {
  const container = document.getElementById("packReveal");
  container.innerHTML = "";

  const grid = document.createElement("div");
  grid.style.display = "grid";
  grid.style.gridTemplateColumns = "repeat(3, 1fr)";
  grid.style.gap = "10px";

  openedCards.forEach(card => {
    const el = document.createElement("div");
    el.className = "grid-card";
    el.textContent = `${card.name} (${card.rarity})`;
    grid.appendChild(el);
  });

  container.appendChild(grid);
}
