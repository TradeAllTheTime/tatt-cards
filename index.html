<!DOCTYPE html>
<html>
<head>
  <title>TATT Cards</title>

  <style>
    body {
      font-family: Arial;
      background: #000;
      color: white;
    }

    #packReveal {
      position: relative;
      height: 280px;
      width: 420px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    .card {
      width: 220px;
      height: 140px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial;
    }

    .card-back {
      background: #333;
      color: white;
    }

    .card-front {
      background: #222;
      transform: rotateY(180deg);
      color: white;
    }

    @keyframes rainbowShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #timerBox {
      max-width: 420px;
      margin: 30px auto;
      padding: 24px;
      border-radius: 16px;
      background: #111;
      text-align: center;
    }
  </style>
</head>

<body>

<h1 style="text-align:center;">TATT Cards</h1>

<div id="timerBox">
  <div style="font-size:12px; opacity:0.7;">NEXT SHOW</div>
  <h2 id="timer">Loading...</h2>
</div>

<div style="text-align:center;">
  <button onclick="openPack()">Open Pack</button>
</div>

<div id="packReveal">
  <p style="opacity:0.5;">Your pack will appear here</p>
</div>

<script>
/* ---------------- TIMER ---------------- */

const concerts = [
  { name: "Amsterdam Night 3", time: new Date("2026-05-20T18:00:00Z") },
  { name: "Amsterdam Night 4", time: new Date("2026-05-22T18:00:00Z") },
  { name: "Amsterdam Night 5", time: new Date("2026-05-23T18:00:00Z") },
  { name: "Amsterdam Night 6", time: new Date("2026-05-26T18:00:00Z") },
  { name: "Amsterdam Night 7", time: new Date("2026-05-29T18:00:00Z") },
  { name: "Amsterdam Night 8", time: new Date("2026-05-30T18:00:00Z") },
  { name: "Amsterdam Night 9", time: new Date("2026-06-04T18:00:00Z") },
  { name: "Amsterdam Night 10", time: new Date("2026-06-05T18:00:00Z") },

  { name: "Wembley Night 1", time: new Date("2026-06-12T19:00:00Z") },
  { name: "Wembley Night 2", time: new Date("2026-06-13T19:00:00Z") },
  { name: "Meltdown Music Festival", time: new Date("2026-06-16T19:00:00Z") },
  { name: "Wembley Night 3", time: new Date("2026-06-17T19:00:00Z") },
  { name: "Wembley Night 4", time: new Date("2026-06-19T19:00:00Z") },
  { name: "Wembley Night 5", time: new Date("2026-06-20T19:00:00Z") },
  { name: "Wembley Night 6", time: new Date("2026-06-23T19:00:00Z") },
  { name: "Wembley Night 7", time: new Date("2026-06-26T19:00:00Z") },
  { name: "Wembley Night 8", time: new Date("2026-06-27T19:00:00Z") },
  { name: "Wembley Night 9", time: new Date("2026-06-29T19:00:00Z") },
  { name: "Wembley Night 10", time: new Date("2026-07-01T19:00:00Z") },
  { name: "Wembley Night 11", time: new Date("2026-07-03T19:00:00Z") },
  { name: "Wembley Night 12", time: new Date("2026-07-04T19:00:00Z") },

  { name: "Melbourne Night 1", time: new Date("2026-11-27T10:00:00Z") },
  { name: "Melbourne Night 2", time: new Date("2026-11-28T10:00:00Z") },
  { name: "Melbourne Night 3", time: new Date("2026-12-02T10:00:00Z") },
  { name: "Melbourne Night 4", time: new Date("2026-12-04T10:00:00Z") },
  { name: "Melbourne Night 5", time: new Date("2026-12-12T10:00:00Z") },
  { name: "Melbourne Night 6", time: new Date("2026-12-13T10:00:00Z") }
];

function getNextConcert() {
  const now = new Date();
  return concerts.filter(c => c.time > now).sort((a,b)=>a.time-b.time)[0];
}

function updateTimer() {
  const el = document.getElementById("timer");
  const next = getNextConcert();

  if (!next) {
    el.textContent = "No upcoming concerts";
    return;
  }

  const diff = next.time - new Date();

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  el.textContent = `${next.name}: ${d}d ${h}h ${m}m ${s}s`;
}

setInterval(updateTimer, 1000);
updateTimer();

/* ---------------- PACK SYSTEM ---------------- */

let deck = [];
let activeIndex = null;
let isAnimating = false;

/* ---------------- CARD POOL ---------------- */

const cardPool = {
  common: ["Common Sketch","Tour Draft","Stage Study"],
  uncommon: ["Lighting Scene","Green Room"],
  rare: ["Golden Moment"],
  ultraRare: ["Legendary Shot"]
};

function getRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ---------------- OPEN PACK ---------------- */

function openPack() {
  let pack = [];

  for (let i = 0; i < 10; i++) {
    let rarity =
      i < 6 ? "common" :
      i < 9 ? "uncommon" :
      Math.random() < 0.75 ? "rare" : "ultra rare";

    let pool =
      rarity === "common" ? cardPool.common :
      rarity === "uncommon" ? cardPool.uncommon :
      rarity === "rare" ? cardPool.rare :
      cardPool.ultraRare;

    pack.push({ name: getRandom(pool), rarity });
  }

  deck = pack;
  renderDeck();
}

/* ---------------- RENDER STACK ---------------- */

function renderDeck() {
  const container = document.getElementById("packReveal");
  container.innerHTML = "";

  deck.forEach((cardData, index) => {

    const card = document.createElement("div");
    card.className = "card";

    const offset = index * 5;

    card.style.position = "absolute";
    card.style.left = "50%";
    card.style.top = "50%";
    card.style.zIndex = deck.length - index;

    card.style.transform =
      `translate(-50%, -50%) translateY(${offset}px)`;

    const inner = document.createElement("div");
    inner.className = "card-inner";

    const back = document.createElement("div");
    back.className = "card-face card-back";
    back.textContent = "TATT CARD";

    const front = document.createElement("div");
    front.className = "card-face card-front";

    // ❗ HIDDEN UNTIL FLIP
    front.textContent = "???";

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);

    card.onclick = (e) => {
      e.stopPropagation();
      openCard(index);
    };

    container.appendChild(card);
  });
}

/* ---------------- OPEN CARD ---------------- */

function openCard(index) {
  if (isAnimating) return;
  isAnimating = true;

  activeIndex = index;

  const cards = document.querySelectorAll(".card");
  const card = cards[index];
  const data = deck[index];

  card.style.zIndex = 9999;
  card.classList.add("flipped");

  setTimeout(() => {

    const front = card.querySelector(".card-front");

    // reveal AFTER flip
    front.textContent = `${data.name} (${data.rarity})`;

    // ---------------- RARITY COLORS ----------------

    if (data.rarity === "common") {
      card.style.boxShadow = "0 0 10px yellow";
    }

    if (data.rarity === "uncommon") {
      card.style.boxShadow = "0 0 10px dodgerblue";
    }

    if (data.rarity === "rare") {
      card.style.boxShadow = "0 0 12px purple";
    }

    if (data.rarity === "ultra rare") {
      card.style.boxShadow = "0 0 18px white";
      card.style.animation = "rainbowShift 1.5s linear infinite";
    }

    isAnimating = false;

  }, 300);
}

/* ---------------- CLOSE ON OUTSIDE CLICK ---------------- */

document.addEventListener("click", () => {
  if (activeIndex === null) return;
  closeCard();
});

/* ---------------- CLOSE CARD ---------------- */

function closeCard() {
  if (activeIndex === null) return;

  const cards = document.querySelectorAll(".card");
  const card = cards[activeIndex];

  card.classList.remove("flipped");

  setTimeout(() => {

    const moved = deck.splice(activeIndex, 1)[0];
    deck.push(moved);

    activeIndex = null;
    renderDeck();

  }, 500);
}
</script>
</style>

</style>
</body>
</html>
