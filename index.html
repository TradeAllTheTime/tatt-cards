<script>
let concerts = [];

function parseCSV(text) {
  const rows = text.trim().split("\n").slice(1);

  return rows.map(row => {
    const [name, time] = row.split(",");

    return {
      name: name.trim(),
      time: new Date(time.trim())
    };
  });
}

function getNextConcert() {
  const now = new Date();
  return concerts
    .filter(c => c.time > now)
    .sort((a, b) => a.time - b.time)[0];
}

function updateTimer() {
  const next = getNextConcert();

  if (!next) {
    document.getElementById("timer").textContent = "No upcoming concerts";
    return;
  }

  const diff = next.time - new Date();

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${next.name}: ${d}d ${h}h ${m}m ${s}s`;
}

async function loadConcerts() {
  try {
    const res = await fetch("shows.csv");
    const text = await res.text();

    concerts = parseCSV(text);

    updateTimer();
    setInterval(updateTimer, 1000);

  } catch (err) {
    console.log(err);
    document.getElementById("timer").textContent =
      "Failed to load concerts";
  }
}

loadConcerts();
</script>
