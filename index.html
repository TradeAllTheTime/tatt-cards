function updateTimer() {
  const next = concerts.find(c => c.time > new Date());
  if (!next) return;
  document.getElementById("timer").textContent = next.name;
}

setInterval(updateTimer, 1000);
updateTimer();

/* ---------------- PACK ---------------- */

const cardPool = {
  common: ["Common Sketch","Tour Draft","Stage Study"],
  uncommon: ["Lighting Scene","Green Room"],
  rare: ["Golden Moment"],
  ultraRare: ["Legendary Shot"]
};

function getRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function openPack() {
  deck = [];

  for (let i = 0; i < 10; i++) {
    let rarity =
      i < 6 ? "common" :
      i < 9 ? "uncommon" :
      Math.random() < 0.75 ? "rare" : "ultra rare";

    let pool =
      rarity === "common" ? cardPool.common :
      rarity === "uncommon" ? cardPool.uncommon :
      rarity === "rare" ? cardPool.rare :
      cardPool.ultraRare;

    deck.push({ name: getRandom(pool), rarity });
  }

  currentIndex = 0;
  buildDeck();
}

function buildDeck() {
  const container = document.getElementById("packReveal");
  container.innerHTML = "";

  deck.forEach((cardData, i) => {

    const card = document.createElement("div");
    card.className = "card";
    card.style.zIndex = deck.length - i;
    card.style.transform = `translateY(${i * 3}px)`;

    const inner = document.createElement("div");
    inner.className = "card-inner";

    const back = document.createElement("div");
    back.className = "card-face card-back";
    back.textContent = "TATT CARD";

    const front = document.createElement("div");
    front.className = "card-face card-front";

    // hide before flip
    front.textContent = "???";

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);
    container.appendChild(card);

    if (i === 0) {
      card.onclick = () => openCard(i);
    }
  });
}

function openCard(i) {
  const cards = document.querySelectorAll(".card");

  const card = cards[i];
  const data = deck[i];

  card.classList.add("flipped");

  setTimeout(() => {
    const front = card.querySelector(".card-front");
    front.textContent = `${data.name} (${data.rarity})`;

    const removed = deck.shift();
    deck.push(removed);

    buildDeck();
  }, 600);
}

<style>
#packReveal {
  position: relative;
  height: 260px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 220px;
  height: 140px;
  position: absolute;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: Arial;
}

.card-back { background:#333; color:white; }

.card-front {
  background:#222;
  transform: rotateY(180deg);
}

/* rainbow ultra rare */
.card.flipped .card-front {
  animation: rainbowShift 1.5s linear infinite;
}

@keyframes rainbowShift {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}
</style>
