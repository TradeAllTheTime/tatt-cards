<!DOCTYPE html>
<html>
<head>
  <title>TATT Cards</title>

  <style>
#packReveal {
  position: relative;
  height: 320px;
  margin-top: 20px;
}

/* STACK AREA */
.deck-card {
  width: 220px;
  height: 140px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform-style: preserve-3d;
  transition: transform 0.35s ease;
  cursor: pointer;
}

/* CARD FLIP CORE */
.card-inner {
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.deck-card.flipped .card-inner {
  transform: rotateY(180deg);
}

/* FACES */
.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: Arial;
}

.card-back {
  background:#333;
  color:white;
}

.card-front {
  background:#222;
  transform: rotateY(180deg);
  color:white;
}

/* DISCARD PILE */
#discardPile {
  position: absolute;
  right: 10px;
  top: 10px;
  width: 220px;
  display:flex;
  flex-direction: column;
  gap: 8px;
}

/* RARITY (ONLY AFTER FLIP) */
.commonGlow { box-shadow: 0 0 10px yellow; }
.uncommonGlow { box-shadow: 0 0 10px dodgerblue; }
.rareGlow { box-shadow: 0 0 12px purple; }

.ultraGlow {
  box-shadow: 0 0 18px white;
  animation: rainbow 1.5s linear infinite;
}

@keyframes rainbow {
  0% { filter:hue-rotate(0deg); }
  100% { filter:hue-rotate(360deg); }
}

/* FINAL GRID VIEW */
#gridView {
  display:none;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.grid-card {
  width: 100%;
  height: 120px;
  background:#222;
  color:white;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: Arial;
}
  </style>
</head>

<body>

<h1 style="text-align:center;">TATT Cards</h1>

<div style="text-align:center;">
  <button onclick="openPack()">Open Pack</button>
</div>

<div id="packReveal"></div>
<div id="gridView"></div>

<script>

let deck = [];
let flippedIndex = null;
let openedCards = [];

/* ---------------- OPEN PACK ---------------- */

function openPack() {
  deck = [];
  openedCards = [];

  for (let i = 0; i < 10; i++) {
    let rarity =
      i < 6 ? "common" :
      i < 9 ? "uncommon" :
      Math.random() < 0.75 ? "rare" : "ultra";

    deck.push({
      name: `Card ${i+1}`,
      rarity
    });
  }

  renderDeck();
}

/* ---------------- RENDER STACK ---------------- */

function renderDeck() {
  const container = document.getElementById("packReveal");
  container.innerHTML = "";

  const discard = document.createElement("div");
  discard.id = "discardPile";
  container.appendChild(discard);

  deck.forEach((card, i) => {

    const el = document.createElement("div");
    el.className = "deck-card";

    const inner = document.createElement("div");
    inner.className = "card-inner";

    const back = document.createElement("div");
    back.className = "card-face card-back";
    back.textContent = "TATT CARD";

    const front = document.createElement("div");
    front.className = "card-face card-front";

    front.textContent = card.name;

    inner.appendChild(back);
    inner.appendChild(front);
    el.appendChild(inner);

    const offset = i * 5;

    el.style.zIndex = deck.length - i;
    el.style.transform =
      `translate(-50%, -50%) translateY(${offset}px) scale(${1 - i*0.02})`;

    el.style.pointerEvents = i === 0 ? "auto" : "none";

    el.onclick = () => handleClick(i);

    container.appendChild(el);
  });
}

/* ---------------- CLICK LOGIC ---------------- */

function handleClick(index) {

  const cards = document.querySelectorAll(".deck-card");
  const cardEl = cards[index];
  const data = deck[index];

  // FIRST CLICK → FLIP
  if (flippedIndex !== index) {
    flippedIndex = index;

    cardEl.classList.add("flipped");

    const front = cardEl.querySelector(".card-front");

    setTimeout(() => {

      front.textContent = `${data.name} (${data.rarity})`;

      if (data.rarity === "common") cardEl.classList.add("commonGlow");
      if (data.rarity === "uncommon") cardEl.classList.add("uncommonGlow");
      if (data.rarity === "rare") cardEl.classList.add("rareGlow");
      if (data.rarity === "ultra") cardEl.classList.add("ultraGlow");

    }, 250);

    return;
  }

  // SECOND CLICK → DISCARD
  const discard = document.getElementById("discardPile");

  const final = document.createElement("div");
  final.className = "grid-card";
  final.textContent = `${data.name} (${data.rarity})`;

  discard.appendChild(final);

  openedCards.push(data);

  deck.splice(index, 1);

  flippedIndex = null;

  // LAST CARD → SHOW GRID VIEW
  if (deck.length === 0) {
    showGrid();
  } else {
    renderDeck();
  }
}

/* ---------------- GRID VIEW ---------------- */

function showGrid() {
  document.getElementById("packReveal").style.display = "none";

  const grid = document.getElementById("gridView");
  grid.style.display = "grid";
  grid.innerHTML = "";

  openedCards.forEach(card => {
    const el = document.createElement("div");
    el.className = "grid-card";
    el.textContent = `${card.name} (${card.rarity})`;
    grid.appendChild(el);
  });
}

</script>

</body>
</html>
