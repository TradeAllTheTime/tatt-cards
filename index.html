<!DOCTYPE html>
<html>
<head>
<title>TATT Cards</title>

<style>
#packReveal {
 position: relative;
 height: 340px;
 margin-top: 20px;
}

/* STACK */
.deck-card {
 width: 220px;
 height: 140px;
 position: absolute;
 left: 50%;
 top: 50%;
 transform-style: preserve-3d;
 transition: transform 0.35s ease;
 cursor: pointer;
}

.card-inner {
 width: 100%;
 height: 100%;
 transition: transform 0.6s;
 transform-style: preserve-3d;
}

.deck-card.flipped .card-inner {
 transform: rotateY(180deg);
}

/* FACES */
.card-face {
 position: absolute;
 width: 100%;
 height: 100%;
 backface-visibility: hidden;
 border-radius: 12px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family: Arial;
}

.card-back {
 background:#333;
 color:white;
}

.card-front {
 background: #222;
 transform: rotateY(180deg);
 color: white;
 border: 1.5px solid #444;
 border-radius: 12px;
}

/* DISCARD */
#discardPile {
 position: absolute;
 right: 10px;
 top: 10px;
 width: 220px;
 display:flex;
 flex-direction: column;
 gap: 8px;
}

.discardCard {
 width: 220px;
 height: 140px;
 background:#222;
 color:white;
 border-radius: 10px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family: Arial;
}

/* RARITY GLOWS */
.commonGlow { box-shadow: 0 0 15px 4px yellow; }
.uncommonGlow { box-shadow: 0 0 15px 4px dodgerblue; }
.rareGlow { box-shadow: 0 0 18px 6px purple; }

.ultraGlow {
 box-shadow: 0 0 20px 6px white;
 border: 3px solid transparent;
 background: transparent;
 background-image:
 linear-gradient(#222, #222),
 linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
 background-origin: border-box;
 background-clip: padding-box, border-box;
 animation: rainbow 1.5s linear infinite;
}

@keyframes rainbow {
 0% { filter: hue-rotate(0deg); }
 100% { filter: hue-rotate(360deg); }
}

/* GRID */
#gridView {
 display:none;
 grid-template-columns: repeat(3, 1fr);
 gap: 10px;
 margin-top: 20px;
}

.grid-card {
 background:#222;
 color:white;
 padding: 10px;
 border-radius: 10px;
 font-family: Arial;
 text-align:center;
 position: relative;
 border: 1.5px solid #444;
 box-sizing: border-box;
}
 .grid-card.ultraGlow {
 border: 3px solid transparent;
 background-image:
 linear-gradient(#222, #222),
 linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);

 background-origin: border-box;
 background-clip: padding-box, border-box;

 animation: rainbow 1.5s linear infinite;

 box-shadow: 0 0 20px 6px white;
}

button {
 padding: 10px 16px;
 border-radius: 10px;
 border: none;
 background: #222;
 color: white;
 cursor: pointer;
 margin: 5px;
}

#packReveal {
 margin-top: 20px;
 position: relative;
 min-height: 300px;
 overflow: visible;
}
</style>
</head>

function updateTimer() {

 const next = concerts.find(c => c.time.getTime() > Date.now())

 if (!next) return;

 const diff = next.time - new Date();

 const d = Math.floor(diff / 86400000);
 const h = Math.floor((diff % 86400000) / 3600000);
 const m = Math.floor((diff % 3600000) / 60000);
 const s = Math.floor((diff % 60000) / 1000);

 document.getElementById("timer").textContent =
 `${next.name}: ${d}d ${h}h ${m}m ${s}s`;
}

setInterval(updateTimer, 1000);

/* ---------------- PACK SYSTEM ---------------- */

const cardPool = {
 common: ["Common Sketch", "Tour Draft", "Stage Study"],
 uncommon: ["Lighting Scene", "Green Room"],
 rare: ["Golden Moment"],
 ultraRare: ["Legendary Shot"]
};

function getRandom(arr) {
 return arr[Math.floor(Math.random() * arr.length)];
}

let deck = [];
let flippedIndex = null;
let openedCards = [];
let newCards = [];

/* ---------------- OPEN PACK ---------------- */

function openPack() {
document.getElementById("packReveal").innerHTML = "";
 document.getElementById("fitcheckScreen").style.display = "none";
 
 document.getElementById("gridView").style.display = "none";
 document.getElementById("packReveal").style.display = "block";

 deck = [];
 openedCards = [];
 flippedIndex = null;
 newCards = [];

 for (let i = 0; i < 10; i++) {

 let rarity =
 i < 6 ? "common" :
 i < 9 ? "uncommon" :
 Math.random() < 0.75 ? "rare" : "ultra";

 let pool =
 rarity === "common" ? cardPool.common :
 rarity === "uncommon" ? cardPool.uncommon :
 rarity === "rare" ? cardPool.rare :
 cardPool.ultraRare;

 deck.push({
 name: getRandom(pool),
 rarity
 });

 }

 renderDeck();
}

function saveCard(cardName, rarity) {

 let collected =
 JSON.parse(localStorage.getItem("collectedCards")) || [];

 const alreadyOwned =
 collected.some(c => c.name === cardName);

 if (!alreadyOwned) {

 collected.push({
 name: cardName,
 rarity: rarity
 });

 localStorage.setItem(
 "collectedCards",
 JSON.stringify(collected)
 );

 newCards.push(cardName);
 }
}

 front.textContent = card.name;

 inner.appendChild(back);
 inner.appendChild(front);

 el.appendChild(inner);

 el.dataset.index = i;

 const offset = i * 5;

 el.style.zIndex = deck.length - i;

 el.style.transform =
 `translate(-50%, -50%) translateY(${offset}px) scale(${1 - i * 0.02})`;

 el.style.position = "absolute";
 el.style.left = "50%";
 el.style.top = "50%";

 el.onclick = () => handleCard(i);

 container.appendChild(el);

 });

}

/* ---------------- CLICK LOGIC ---------------- */

function handleCard(index) {

 const cardEl =
 document.querySelectorAll(".deck-card")[index];

 const data = deck[index];

 if (!cardEl.classList.contains("flipped")) {

 cardEl.classList.add("flipped");

 const front =
 cardEl.querySelector(".card-front");

 setTimeout(() => {

 front.textContent =
 `${data.name} (${data.rarity})`;

 saveCard(data.name, data.rarity);

 if (data.rarity === "common")
 cardEl.classList.add("commonGlow");

 if (data.rarity === "uncommon")
 cardEl.classList.add("uncommonGlow");

 if (data.rarity === "rare")
 cardEl.classList.add("rareGlow");

 if (data.rarity === "ultra")
 cardEl.classList.add("ultraGlow");

 }, 250);

 return;
 }

 const discard =
 document.getElementById("discardPile");

 const final = document.createElement("div");

 final.className = "discardCard";

 final.textContent =
 `${data.name} (${data.rarity})`;

 discard.appendChild(final);

 openedCards.push(data);

 deck.splice(index, 1);

 if (deck.length === 0) {
 showGrid();
 } else {
 renderDeck();
 }
}

/* -------- OPEN FITCHECK -------- */

function openFitcheck() {
  const now = new Date();
  const next = concerts.find(c => c.time > now);

  if (!next) return;

  const screen = document.getElementById("fitcheckScreen");

  document.getElementById("packReveal").style.display = "none";
  document.getElementById("gridView").style.display = "none";
  screen.style.display = "block";

  // ALWAYS load saved guess first
  const saved = JSON.parse(localStorage.getItem("fitcheck_" + next.name));

  // DEV MODE (still respects saved data)
  if (window.DEV_MODE === true) {
    if (saved) {
      showFitcheckResults(next.name, saved);
    } else {
      renderFitcheck(next);
    }
    return;
  }

  // NORMAL MODE
  if (saved) {
    showFitcheckResults(next.name, saved);
    return;
  }

  renderFitcheck(next);
}

/* -------- SAVE GUESS -------- */

function submitFitcheck(showName) {
  const guess = {
    shirt: document.getElementById("shirt").value,
    tie: document.getElementById("tie").value,
    jacket: document.getElementById("jacket").value,
    pattern: document.getElementById("pattern").value,
    song: document.getElementById("song").value
  };

  localStorage.setItem(
    "fitcheck_" + showName,
    JSON.stringify(guess)
  );

  showFitcheckResults(showName, guess);
}

/* -------- RESULTS -------- */

function showFitcheckResults(showName, guess) {
  const screen = document.getElementById("fitcheckScreen");
  const actual = fitcheckAnswers[showName];

  if (!actual) {
    screen.innerHTML = `
      <h2>Fitcheck Locked ✔</h2>
      <p>Check back after the show for results.</p>
    `;
    return;
  }

  function row(label, user, correct) {
    const ok = user === correct;

    return `
      <div style="
        display:flex;
        justify-content:space-between;
        padding:10px;
        margin:6px 0;
        background:#1a1a1a;
        border-radius:8px;
        font-family:Arial;
      ">
        <span>${label}: <b>${user || "none"}</b></span>
        <span style="color:${ok ? "limegreen" : "red"}; font-weight:bold;">
          ${ok ? "✔" : "✖"} ${correct}
        </span>
      </div>
    `;
  }

  let correct = 0;
  if (guess.shirt === actual.shirt) correct++;
  if (guess.tie === actual.tie) correct++;
  if (guess.jacket === actual.jacket) correct++;
  if (guess.pattern === actual.pattern) correct++;
  if (guess.song === actual.song) correct++;

  const earned =
    correct <= 1 ? 1 :
    correct === 2 ? 2 :
    correct === 3 ? 5 :
    correct === 4 ? 8 :
    correct === 5 ? 12 ;



  addToBank(earned);

  screen.innerHTML = `
    <h2>Fitcheck Results</h2>
    <h3>${showName}</h3>

    ${row("Shirt", guess.shirt, actual.shirt)}
    ${row("Tie", guess.tie, actual.tie)}
    ${row("Jacket", guess.jacket, actual.jacket)}
    ${row("Pattern", guess.pattern, actual.pattern)}
    ${row("Song", guess.song, actual.song)}

    <div style="
      margin-top:15px;
      padding:12px;
      background:#111;
      border-radius:10px;
      text-align:center;
      font-family:Arial;
    ">
      <div>${correct}/5 correct</div>
      <div style="margin-top:8px; font-weight:bold;">
        🎉 You earned ${earned} points!
      </div>
      <div style="opacity:0.7; margin-top:5px;">
        Total Bank: ${fitcheckBank}
      </div>
    </div>
  `;
}

/* -------- POINT CALC -------- */

function calculatePoints(correctCount) {
  if (correctCount <= 1) return 1;
  if (correctCount === 2) return 2;
  if (correctCount === 3) return 5;
  if (correctCount === 4) return 10;
}
</script>
