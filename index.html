body {

.deck-card {
 width: 220px;
 height: 140px;
 position: absolute;
 left: 50%;
 top: 50%;
 transform-style: preserve-3d;
 transition: transform 0.35s ease;
 cursor: pointer;
}

.card-inner {
 width: 100%;
 height: 100%;
 transition: transform 0.6s;
 transform-style: preserve-3d;
}

.deck-card.flipped .card-inner {
 transform: rotateY(180deg);
}

/* FACES */
.card-face {
 position: absolute;
 width: 100%;
 height: 100%;
 backface-visibility: hidden;
 border-radius: 12px;
 display:flex;
 align-items:center;

</div>

.card-back {
 background:#333;
 color:white;
}

.card-front {
 background: #222;
 transform: rotateY(180deg);
 color: white;
 border: 1.5px solid #444;
 border-radius: 12px;
}

/* DISCARD */
#discardPile {
 position: absolute;
 right: 10px;
 top: 10px;
 width: 220px;
 display:flex;
 flex-direction: column;
 gap: 8px;
}

.discardCard {
 width: 220px;
 height: 140px;
 background:#222;
 color:white;
 border-radius: 10px;
 display:flex;
 align-items:center;
 justify-content:center;

}

/* RARITY GLOWS */
.commonGlow { box-shadow: 0 0 15px 4px yellow; }
.uncommonGlow { box-shadow: 0 0 15px 4px dodgerblue; }
.rareGlow { box-shadow: 0 0 18px 6px purple; }

.ultraGlow {
 box-shadow: 0 0 20px 6px white;
 border: 3px solid transparent;
 background: transparent;
 background-image:
 linear-gradient(#222, #222),
 linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
 background-origin: border-box;
 background-clip: padding-box, border-box;
 animation: rainbow 1.5s linear infinite;
}

@keyframes rainbow {
 0% { filter: hue-rotate(0deg); }
 100% { filter: hue-rotate(360deg); }
}

/* GRID */
#gridView {
 display:none;
 grid-template-columns: repeat(3, 1fr);
 gap: 10px;
 margin-top: 20px;
}

.grid-card {
 background:#222;
 color:white;
 padding: 10px;
 border-radius: 10px;
 font-family: Arial;
 text-align:center;
 position: relative;
 border: 1.5px solid #444;
 box-sizing: border-box;
}
 .grid-card.ultraGlow {
 border: 3px solid transparent;

 linear-gradient(#222, #222),
 linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);

 background-origin: border-box;
 background-clip: padding-box, border-box;

 animation: rainbow 1.5s linear infinite;

 box-shadow: 0 0 20px 6px white;
}

button {
  padding: 12px 18px;
  border-radius: 16px;
  border: none;

  background: linear-gradient(135deg, #ff4fd8, #9b5cff, #5bc0ff);
  background-size: 200% 200%;

  color: white;
  font-weight: bold;
  font-size: 15px;

  cursor: pointer;
  margin: 6px;

  box-shadow: 0 0 20px rgba(255,79,216,0.3);

}

button:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 0 25px rgba(91,192,255,0.45);
}

@keyframes discoGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

 radial-gradient(

.sparkle2 {

.sparkle3 {

}

@keyframes floatGlow {
 0% { transform:translateY(0px); }
 50% { transform:translateY(40px); }
 100% { transform:translateY(0px); }
}

function updateTimer() {

 const now = new Date();

 const next = concerts.find(c => {

   const endTime =
     new Date(c.time.getTime() + (3 * 60 * 60 * 1000));

   return endTime > now;

 });

 if (!next) return;

 const showStart = next.time;

 const showEnd =
   new Date(showStart.getTime() + (3 * 60 * 60 * 1000));

 // SHOW IS LIVE
 if (now >= showStart && now <= showEnd) {

   document.getElementById("timer").textContent =
   `${next.name}: HAPPENING NOW`;

   return;
 }

 // NORMAL COUNTDOWN
 const diff = showStart - now;

 const d = Math.floor(diff / 86400000);
 const h = Math.floor((diff % 86400000) / 3600000);
 const m = Math.floor((diff % 3600000) / 60000);
 const s = Math.floor((diff % 60000) / 1000);

 document.getElementById("timer").textContent =
 `${next.name}: ${d}d ${h}h ${m}m ${s}s`;

}

setInterval(updateTimer, 1000);

/* ---------------- PACK SYSTEM ---------------- */

const cardPool = {
 common: ["Common Sketch", "Tour Draft", "Stage Study"],
 uncommon: ["Lighting Scene", "Green Room"],
 rare: ["Golden Moment"],
 ultraRare: ["Legendary Shot"]
};

function getRandom(arr) {
 return arr[Math.floor(Math.random() * arr.length)];
}

let deck = [];
let flippedIndex = null;
let openedCards = [];
let newCards = [];

/* ---------------- OPEN PACK ---------------- */
function getTodayKey() {
  return new Date().toISOString().split("T")[0];
}

function getDailyData() {
  const data = JSON.parse(localStorage.getItem("dailyPacks")) || {
    date: null,
    used: 0
  };

  const today = getTodayKey();

  // reset if new day
  if (data.date !== today) {
    data.date = today;
    data.used = 0;
    localStorage.setItem("dailyPacks", JSON.stringify(data));
  }

  return data;
}

function incrementDailyUse() {
  const data = getDailyData();
  data.used += 1;
  localStorage.setItem("dailyPacks", JSON.stringify(data));
}
function openPack() {

  const daily = getDailyData();
  const hasFreePack = daily.used < DAILY_PACK_LIMIT;
  const canUsePoints = fitcheckBank >= 10;

  if (!hasFreePack && !canUsePoints) {
    alert("No free packs left today and not enough points!");
    return;
  }

  if (hasFreePack) {
    incrementDailyUse();
  } else {
    addToBank(-10);
  }

  document.getElementById("packReveal").innerHTML = "";
  document.getElementById("fitcheckScreen").style.display = "none";
  document.getElementById("gridView").style.display = "none";
  document.getElementById("packReveal").style.display = "block";

  deck = [];
  openedCards = [];
  flippedIndex = null;
  newCards = [];

  for (let i = 0; i < 10; i++) {

    let rarity =
      i < 6 ? "common" :
      i < 9 ? "uncommon" :
      Math.random() < 0.75 ? "rare" : "ultra";

    let pool =
      rarity === "common" ? cardPool.common :
      rarity === "uncommon" ? cardPool.uncommon :
      rarity === "rare" ? cardPool.rare :
      cardPool.ultraRare;

    deck.push({
      name: getRandom(pool),
      rarity
    });
  }

  renderDeck();
}

function saveCard(cardName, rarity) {

 let collected =
 JSON.parse(localStorage.getItem("collectedCards")) || [];

 const alreadyOwned =
 collected.some(c => c.name === cardName);

 if (!alreadyOwned) {

 collected.push({
 name: cardName,
 rarity: rarity
 });

 localStorage.setItem(
 "collectedCards",
 JSON.stringify(collected)
 );

 newCards.push(cardName);
 }
}

/* ---------------- GRID ---------------- */

function renderGrid(cards, markNew = false) {

 const grid = document.getElementById("gridView");

 grid.innerHTML = "";
 grid.style.display = "grid";

 document.getElementById("packReveal").style.display = "none";

 cards.forEach(card => {

 "grid-card",

 el.style.position = "relative";

 el.textContent = card.name;

 badge.textContent = "NEW";

 badge.style.cssText = `
 position:absolute;
 top:-6px;
 right:-6px;
 background:#ff4444;
 color:white;
 padding:2px 8px;
 border-radius:10px;
 font-size:11px;
 font-weight:bold;
 z-index:2;
 `;

 el.appendChild(badge);
 }

 grid.appendChild(el);

 });
}

/* ---------------- RENDER ---------------- */

function renderDeck() {

 const container =
 document.getElementById("packReveal");

 container.innerHTML = "";

 const discard = document.createElement("div");

 discard.id = "discardPile";

 container.appendChild(discard);

 deck.forEach((card, i) => {

 const el = document.createElement("div");

 el.className = "deck-card";

 const inner = document.createElement("div");

 inner.className = "card-inner";

 const back = document.createElement("div");

 back.className = "card-face card-back";

 back.textContent = "TATT CARD";

 const front = document.createElement("div");

 front.className = "card-face card-front";

 front.textContent = card.name;

 inner.appendChild(back);
 inner.appendChild(front);

 el.appendChild(inner);

 el.dataset.index = i;

 const offset = i * 5;

 el.style.zIndex = deck.length - i;

 el.style.transform =
 `translate(-50%, -50%) translateY(${offset}px) scale(${1 - i * 0.02})`;

 el.style.position = "absolute";
 el.style.left = "50%";
 el.style.top = "50%";

 el.onclick = () => handleCard(i);

 container.appendChild(el);

 });

}

/* ---------------- CLICK LOGIC ---------------- */

function handleCard(index) {

 const cardEl =
 document.querySelectorAll(".deck-card")[index];

 const data = deck[index];

 if (!cardEl.classList.contains("flipped")) {

 cardEl.classList.add("flipped");

 const front =
 cardEl.querySelector(".card-front");

 setTimeout(() => {

 front.textContent =
 `${data.name} (${data.rarity})`;

 saveCard(data.name, data.rarity);

 if (data.rarity === "common")
 cardEl.classList.add("commonGlow");

 if (data.rarity === "uncommon")
 cardEl.classList.add("uncommonGlow");

 if (data.rarity === "rare")
 cardEl.classList.add("rareGlow");

 if (data.rarity === "ultra")
 cardEl.classList.add("ultraGlow");

 }, 250);

 return;
 }

 const discard =
 document.getElementById("discardPile");

 const final = document.createElement("div");

 final.className = "discardCard";

 final.textContent =
 `${data.name} (${data.rarity})`;

 discard.appendChild(final);

 openedCards.push(data);

 deck.splice(index, 1);

 if (deck.length === 0) {
 showGrid();
 } else {
 renderDeck();
 }
}

/* ---------------- FINAL GRID ---------------- */

function showGrid() {
 renderGrid(openedCards, true);

  updateBankDisplay();

/* -------- OPEN FITCHECK -------- */

function openFitcheck() {
  const now = new Date();
  const next = concerts.find(c => c.time > now);

  if (!next) return;

  const screen = document.getElementById("fitcheckScreen");

  document.getElementById("packReveal").style.display = "none";
  document.getElementById("gridView").style.display = "none";
  screen.style.display = "block";

  // ALWAYS load saved guess first
  const saved = JSON.parse(localStorage.getItem("fitcheck_" + next.name));

  // DEV MODE (still respects saved data)
  if (window.DEV_MODE === true) {
    if (saved) {
      showFitcheckResults(next.name, saved);
    } else {
      renderFitcheck(next);
    }
    return;
  }

  // NORMAL MODE
  if (saved) {
    showFitcheckResults(next.name, saved);
    return;
  }

  renderFitcheck(next);
}

/* -------- SAVE GUESS -------- */

function submitFitcheck(showName) {
  const guess = {
    shirt: document.getElementById("shirt").value,
    tie: document.getElementById("tie").value,
    jacket: document.getElementById("jacket").value,
    pattern: document.getElementById("pattern").value,
    song: document.getElementById("song").value
  };

  localStorage.setItem(
    "fitcheck_" + showName,
    JSON.stringify(guess)
  );

  showFitcheckResults(showName, guess);
}

/* -------- RESULTS -------- */

function showFitcheckResults(showName, guess) {
  const screen = document.getElementById("fitcheckScreen");
  const actual = fitcheckAnswers[showName];

  if (!actual) {
    screen.innerHTML = `
      <h2>Fitcheck Locked ✔</h2>
      <p>Check back after the show for results.</p>
    `;
    return;
  }

  function row(label, user, correct) {
    const ok = user === correct;

    return `
      <div style="
        display:flex;
        justify-content:space-between;
        padding:10px;
        margin:6px 0;
        background:#1a1a1a;
        border-radius:8px;
        font-family:Arial;
      ">
        <span>${label}: <b>${user || "none"}</b></span>
        <span style="color:${ok ? "limegreen" : "red"}; font-weight:bold;">
          ${ok ? "✔" : "✖"} ${correct}
        </span>
      </div>
    `;
  }

  let correct = 0;
  if (guess.shirt === actual.shirt) correct++;
  if (guess.tie === actual.tie) correct++;
  if (guess.jacket === actual.jacket) correct++;
  if (guess.pattern === actual.pattern) correct++;
  if (guess.song === actual.song) correct++;

const earned =
  correct <= 1 ? 1 :
  correct === 2 ? 2 :
  correct === 3 ? 5 :
  correct === 4 ? 8 :
  correct === 5 ? 12 :
  0;



  const rewardKey = "rewarded_" + showName;

if (!localStorage.getItem(rewardKey)) {
  addToBank(earned);
  localStorage.setItem(rewardKey, "true");
}

  screen.innerHTML = `
    <h2>Fitcheck Results</h2>
    <h3>${showName}</h3>

    ${row("Shirt", guess.shirt, actual.shirt)}
    ${row("Tie", guess.tie, actual.tie)}
    ${row("Jacket", guess.jacket, actual.jacket)}
    ${row("Pattern", guess.pattern, actual.pattern)}
    ${row("Song", guess.song, actual.song)}

    <div style="
      margin-top:15px;
      padding:12px;
      background:#111;
      border-radius:10px;
      text-align:center;
      font-family:Arial;
    ">
      <div>${correct}/5 correct</div>
      <div style="margin-top:8px; font-weight:bold;">
        🎉 You earned ${earned} points!
      </div>
      <div style="opacity:0.7; margin-top:5px;">
        Total Bank: ${fitcheckBank}
      </div>
    </div>
  `;
}
function buyPack() {

  if (fitcheckBank < 10) {
    alert("Not enough points!");
    return;
  }

  const confirmBuy = confirm("Spend 10 points for 1 pack?");
  if (!confirmBuy) return;

  addToBank(-10);
  openPack();
}
function buyRare() {

  if (fitcheckBank < 20) {
    alert("Not enough points!");
    return;
  }

  const confirmBuy = confirm("Spend 20 points for a RANDOM Rare card?");
  if (!confirmBuy) return;

  addToBank(-20);

  const rarePool = cardPool.rare;
  const card = getRandom(rarePool);

  openedCards.push({ name: card, rarity: "rare" });
  showGrid();
} 
 function buyUltra() {

  if (fitcheckBank < 50) {
    alert("Not enough points!");
    return;
  }

  const confirmBuy = confirm("Spend 50 points for a RANDOM Ultra Rare card?");
  if (!confirmBuy) return;

  addToBank(-50);

  const card = getRandom(cardPool.ultraRare);

  openedCards.push({ name: card, rarity: "ultra" });
  showGrid();
}
 function openShop() {

  // hide other screens
  document.getElementById("packReveal").style.display = "none";
  document.getElementById("gridView").style.display = "none";
  document.getElementById("fitcheckScreen").style.display = "none";

  // show shop
  const shop = document.getElementById("shopScreen");
  shop.style.display = "block";

  shop.innerHTML = `
    <h2>Shop</h2>

    <div style="margin-top:15px;">

      <button onclick="buyPack()">Buy Pack - 10 pts</button><br><br>

      <button onclick="buyRare()">Buy Random Rare - 20 pts</button><br><br>

      <button onclick="buyUltra()">Buy Random Ultra Rare - 50 pts</button>

    </div>
  `;
}

function toggleShop() {
  const shopBtn = document.getElementById("shopButton");
  const shop = document.getElementById("shopScreen");

  if (!shopOpen) {
    closeAllScreens();

    shop.style.display = "block";

    shop.innerHTML = `
      <h2>Shop</h2>

      <button onclick="buyPack()">Buy Pack - 10 pts</button><br><br>
      <button onclick="buyRare()">Buy Rare - 20 pts</button><br><br>
      <button onclick="buyUltra()">Buy Ultra - 50 pts</button>
    `;

    shopBtn.textContent = "Close Shop";
    shopOpen = true;

  } else {
    closeAllScreens();
  }
}
function closeAllScreens() {

  document.getElementById("packReveal").style.display = "none";
  document.getElementById("gridView").style.display = "none";
  document.getElementById("fitcheckScreen").style.display = "none";
  document.getElementById("shopScreen").style.display = "none";

  shopOpen = false;

  const shopBtn = document.getElementById("shopButton");
  if (shopBtn) shopBtn.textContent = "Open Shop";
}
