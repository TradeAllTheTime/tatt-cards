/* =========================
   TIMER
========================= */

function getNextConcert() {
  const now = new Date();
  return concerts.filter(c => c.time > now).sort((a,b)=>a.time-b.time)[0];
}

function updateTimer() {
  const next = getNextConcert();
  if (!next) return;

  document.getElementById("timer").textContent = next.name;
}

setInterval(updateTimer, 1000);
updateTimer();

/* =========================
   PACK SYSTEM
========================= */

const cardPool = {
  common: ["Common Sketch"],
  uncommon: ["Lighting Scene"],
  rare: ["Golden Moment"],
  ultraRare: ["Legendary Shot"]
};

function getRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function openPack() {

  let pack = [];

  for (let i = 0; i < 6; i++) pack.push({ name: getRandom(cardPool.common), rarity: "common" });
  for (let i = 0; i < 3; i++) pack.push({ name: getRandom(cardPool.uncommon), rarity: "uncommon" });

  const roll = Math.random();
  pack.push({
    name: roll < 0.75 ? getRandom(cardPool.rare) : getRandom(cardPool.ultraRare),
    rarity: roll < 0.75 ? "rare" : "ultra rare"
  });

  const container = document.getElementById("packReveal");
  container.innerHTML = "<h3>Opening Pack...</h3>";

  setTimeout(() => {
    container.innerHTML = "";
    deck = pack;
    buildDeck();
  }, 600);
}

function buildDeck() {
  const container = document.getElementById("packReveal");
  container.innerHTML = "";

  deck.forEach((cardData, index) => {
    const card = document.createElement("div");
    card.className = "card";

    const inner = document.createElement("div");
    inner.className = "card-inner";

    const back = document.createElement("div");
    back.className = "card-face card-back";
    back.textContent = "TATT CARD";

    const front = document.createElement("div");
    front.className = "card-face card-front";
    front.textContent = `${cardData.name} (${cardData.rarity})`;

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);
    container.appendChild(card);

    card.onclick = () => revealCard(index);
  });
}

function revealCard(index) {
  const cards = document.querySelectorAll(".card");
  cards[index].classList.add("flipped");

  setTimeout(() => {
    moveToBack(index);
  }, 600);
}

function moveToBack(index) {
  const card = deck.splice(index, 1)[0];
  deck.push(card);
  buildDeck();
}
