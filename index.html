<!DOCTYPE html>
<html>
<head>
  <title>TATT Cards</title>
  <style>
#packReveal {
  position: relative;
  height: 300px;
  margin-top: 20px;
}

/* MAIN STACK */
.deck-card {
  width: 160px;
  height: 220px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  transform-style: preserve-3d;
  transition: transform 0.4s ease;
  cursor: pointer;
}

/* FACE DOWN STYLE */
.card-back,
.card-front {
  width: 100%;
  height: 100%;
  position: absolute;
  border-radius: 12px;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial;
}

/* BACK */
.card-back {
  background: #333;
  color: white;
}

/* FRONT */
.card-front {
  background: #222;
  transform: rotateY(180deg);
}

/* FLIP */
.card-inner {
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.flipped .card-inner {
  transform: rotateY(180deg);
}

/* SECOND PILE (discard) */
.discard-pile {
  position: absolute;
  right: 10px;
  top: 20px;
  width: 160px;
}

/* RARITY COLORS (ONLY VISIBLE AFTER FLIP) */
.common { box-shadow: 0 0 10px yellow; }
.uncommon { box-shadow: 0 0 10px dodgerblue; }
.rare { box-shadow: 0 0 12px purple; }

.ultra {
  box-shadow: 0 0 18px white;
  animation: rainbowBorder 1.5s linear infinite;
}

@keyframes rainbowBorder {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}
</style>
</head>

/* ---------------- TIMER ---------------- */

function getNextConcert() {
  const now = new Date();
  return concerts
    .filter(c => c.time > now)
    .sort((a, b) => a.time - b.time)[0];
}

function updateTimer() {
  const next = getNextConcert();

  if (!next) return;

  const diff = next.time - new Date();

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${next.name}: ${d}d ${h}h ${m}m ${s}s`;
}

setInterval(updateTimer, 1000);
updateTimer();

/* ---------------- PACK SYSTEM ---------------- */

let deck = [];
let flippedCard = null;

const cardPool = {
  common: ["Common Sketch", "Tour Draft", "Stage Study"],
  uncommon: ["Lighting Scene", "Green Room"],
  rare: ["Golden Moment"],
  ultraRare: ["Legendary Shot"]
};

function getRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ---------------- OPEN PACK ---------------- */

function openPack() {
  deck = [];

  for (let i = 0; i < 10; i++) {
    let rarity =
      i < 6 ? "common" :
      i < 9 ? "uncommon" :
      Math.random() < 0.75 ? "rare" : "ultra";

    let pool =
      rarity === "common" ? cardPool.common :
      rarity === "uncommon" ? cardPool.uncommon :
      rarity === "rare" ? cardPool.rare :
      cardPool.ultraRare;

    deck.push({
      name: getRandom(pool),
      rarity
    });
  }

  renderDeck();
}

/* ---------------- RENDER DECK ---------------- */

function renderDeck() {
  const container = document.getElementById("packReveal");
  container.innerHTML = "";

  const discard = document.createElement("div");
  discard.id = "discardPile";
  discard.className = "discard-pile";
  container.appendChild(discard);

  deck.forEach((cardData, i) => {

    const card = document.createElement("div");
    card.className = "deck-card";

    const inner = document.createElement("div");
    inner.className = "card-inner";

    const back = document.createElement("div");
    back.className = "card-back";
    back.textContent = "TATT CARD";

    const front = document.createElement("div");
    front.className = "card-front";

    // HIDDEN UNTIL FLIP
    front.textContent = "";

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);

    // stack effect
    card.style.zIndex = deck.length - i;
    card.style.transform =
      `translate(-50%, -50%) translateY(${i * 4}px) scale(${1 - i * 0.02})`;

    // only top card clickable
    card.style.pointerEvents = i === 0 ? "auto" : "none";

    card.onclick = () => handleCardClick(card, cardData, i);

    container.appendChild(card);
  });
}

/* ---------------- CLICK LOGIC ---------------- */

function handleCardClick(card, data, index) {

  // FIRST CLICK → FLIP
  if (!card.classList.contains("flipped")) {

    card.classList.add("flipped");

    setTimeout(() => {
      const front = card.querySelector(".card-front");

      // SHOW RARITY ONLY AFTER FLIP
      front.textContent = `${data.name} (${data.rarity})`;

      // RARITY STYLING
      if (data.rarity === "common") card.classList.add("common");
      if (data.rarity === "uncommon") card.classList.add("uncommon");
      if (data.rarity === "rare") card.classList.add("rare");
      if (data.rarity === "ultra") card.classList.add("ultra");

      flippedCard = card;
    }, 300);

    return;
  }

// SECOND CLICK → MOVE TO DISCARD PILE
const discard = document.getElementById("discardPile");

card.style.position = "relative";
card.style.transform = "none";
card.style.marginBottom = "10px";

discard.appendChild(card);

deck.splice(index, 1);

// if no cards left → show grid view
if (deck.length === 0) {
  renderGridView();
} else {
  renderDeck();
}
  function renderGridView() {
  const container = document.getElementById("packReveal");

  container.innerHTML = `
    <div id="grid" style="
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:10px;
      padding:10px;
    "></div>
  `;

  const grid = document.getElementById("grid");

  deck.forEach(cardData => {
    const card = document.createElement("div");

    card.style.padding = "10px";
    card.style.borderRadius = "10px";
    card.style.background = "#222";
    card.style.fontFamily = "Arial";
    card.style.fontSize = "12px";
    card.style.textAlign = "center";

    card.textContent = `${cardData.name} (${cardData.rarity})`;

    // KEEP YOUR RARITY COLORS
    if (cardData.rarity === "common") card.style.boxShadow = "0 0 10px yellow";
    if (cardData.rarity === "uncommon") card.style.boxShadow = "0 0 10px dodgerblue";
    if (cardData.rarity === "rare") card.style.boxShadow = "0 0 12px purple";

    if (cardData.rarity === "ultra") {
      card.style.boxShadow = "0 0 18px red";
      card.style.animation = "rainbowBorder 2s linear infinite";
    }

    grid.appendChild(card);
  });
}
