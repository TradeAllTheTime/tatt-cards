<!DOCTYPE html>

<head>
  <title>TATT Cards</title>

  <style>
#packArea {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 20px;
}

/* TIMER CARD */
.timerBox {
  max-width: 420px;
  margin: 30px auto;
  padding: 24px;
  border-radius: 16px;
  background: #111;
  color: white;
  text-align: center;
  font-family: Arial;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* PACK AREA */
#packReveal {
  position: relative;
  width: 260px;
  height: 220px;
  margin: 20px auto;
}

/* GRID VIEW (FINAL REVEAL) */
#gridView {
  display: none;
  max-width: 900px;
  margin: 20px auto;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.gridCard {
  background: #222;
  color: white;
  font-family: Arial;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

/* STACK CARD */
.deck-card {
  width: 160px;
  height: 220px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform-style: preserve-3d;
  cursor: pointer;
  transition: transform 0.35s ease;
}

/* FLIP */
.card-inner {
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
}

.deck-card.flipped .card-inner {
  transform: rotateY(180deg);
}

/* FACES */
.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 12px;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial;
}

.card-back {
  background: #333;
  color: white;
}

.card-front {
  background: #222;
  transform: rotateY(180deg);
  color: white;
}

/* RARITY */
.common { box-shadow: 0 0 10px yellow; }
.uncommon { box-shadow: 0 0 10px dodgerblue; }
.rare { box-shadow: 0 0 12px purple; }

.ultra {
  box-shadow: 0 0 18px white;
  animation: rainbow 1.5s linear infinite;
}

@keyframes rainbow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

/* DISCARD */
#discardPile {
  width: 220px;
  min-height: 140px;
  margin: 20px auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
  </style>
</head>

function updateTimer() {
  const next = concerts.filter(c => c.time > new Date())[0];
  if (!next) return;

  const diff = next.time - new Date();

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${next.name}: ${d}d ${h}h ${m}m ${s}s`;
}

setInterval(updateTimer, 1000);
updateTimer();

/* ================= PACK ================= */

const cardPool = {
  common: ["Common Sketch","Tour Draft","Stage Study"],
  uncommon: ["Lighting Scene","Green Room"],
  rare: ["Golden Moment"],
  ultraRare: ["Legendary Shot"]
};

function getRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

let deck = [];

let flippedCards = 0;

function openPack() {
  deck = [];
  flippedCards = 0;

  for (let i = 0; i < 10; i++) {
    let rarity =
      i < 6 ? "common" :
      i < 9 ? "uncommon" :
      Math.random() < 0.75 ? "rare" : "ultra";

    let pool =
      rarity === "common" ? cardPool.common :
      rarity === "uncommon" ? cardPool.uncommon :
      rarity === "rare" ? cardPool.rare :
      cardPool.ultraRare;

    deck.push({ name: getRandom(pool), rarity });
  }

  renderDeck();
}

function renderDeck() {
  const container = document.getElementById("packReveal");
  container.innerHTML = "";

  deck.forEach((cardData, i) => {

    const card = document.createElement("div");
    card.className = "deck-card";

    const inner = document.createElement("div");
    inner.className = "card-inner";

    const back = document.createElement("div");
    back.className = "card-back";
    back.textContent = "TATT CARD";

    const front = document.createElement("div");
    front.className = "card-front";
    front.textContent = cardData.name;

    card.dataset.rarity = cardData.rarity;

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);

    card.style.zIndex = deck.length - i;
    card.style.transform = `translate(-50%, -50%) translateY(${i * 4}px)`;

    card.onclick = () => flipCard(card, cardData);

    container.appendChild(card);
  });
}

function flipCard(card, data) {

  if (!card.classList.contains("flipped")) {

    card.classList.add("flipped");

    setTimeout(() => {

      const front = card.querySelector(".card-front");

      front.textContent = `${data.name} (${data.rarity})`;

      if (data.rarity === "common") card.classList.add("common");
      if (data.rarity === "uncommon") card.classList.add("uncommon");
      if (data.rarity === "rare") card.classList.add("rare");
      if (data.rarity === "ultra") card.classList.add("ultra");

    }, 250);

    flippedCards++;

  } else {

    const discard = document.getElementById("discardPile");

    const clone = card.cloneNode(true);
    clone.style.position = "relative";
    clone.style.margin = "6px 0";

    discard.appendChild(clone);

    card.remove();
    flippedCards++;

    if (flippedCards === 10) {
      showGrid();
    }
  }
}

function showGrid() {
  const grid = document.getElementById("gridView");
  grid.innerHTML = "";
  grid.style.display = "grid";

  deck.forEach(c => {
    const div = document.createElement("div");
    div.className = "gridCard";
    div.textContent = `${c.name} (${c.rarity})`;
    grid.appendChild(div);
  });
}
