<!DOCTYPE html>
<html>
<head>
  <title>TATT Cards</title>
</head>
<body>

<h1>TATT Cards</h1>
<h2>Next Concert In:</h2>

<p id="timer">Loading...</p>

<script>
const concerts = [
  { name: "Amsterdam Night 1", time: new Date("2026-05-20T18:00:00Z") },
  { name: "Wembley Night 1", time: new Date("2026-06-12T19:00:00Z") },
  { name: "MSG Night 1", time: new Date("2026-07-17T00:00:00Z") },
  { name: "HARRYWEEN Night 1", time: new Date("2026-10-30T00:00:00Z") }
];

function getNextConcert() {
  const now = new Date();
  return concerts
    .filter(c => c.time > now)
    .sort((a, b) => a.time - b.time)[0];
}

function updateTimer() {
  const next = getNextConcert();

  if (!next) {
    document.getElementById("timer").textContent = "No upcoming concerts";
    return;
  }

  const diff = next.time - new Date();

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${next.name}: ${d}d ${h}h ${m}m ${s}s`;
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
